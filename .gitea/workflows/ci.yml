name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, pdo, pdo_mysql
          coverage: none

      - name: Composer-Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP-Syntaxprüfung
        run: |
          find lib tests public/api public/admin-api -name "*.php" \
            | xargs -P4 -I{} php -l {}

      - name: Unit-Tests
        run: vendor/bin/phpunit --no-progress

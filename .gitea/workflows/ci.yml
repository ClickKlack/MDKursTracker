name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: php:8.2-cli

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: System-Abhängigkeiten installieren
        run: |
          apt-get update -qq
          apt-get install -y -qq libpq-dev unzip git

      - name: PHP-Extensions installieren
        run: docker-php-ext-install pdo pdo_mysql

      - name: Composer installieren
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Composer-Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: PHP-Syntaxprüfung (Lint)
        run: |
          TARGET_DIRS="lib tests public/api public/admin-api"
          for dir in $TARGET_DIRS; do
            if [ -d "$dir" ]; then
              echo "Prüfe PHP-Syntax in $dir..."
              find "$dir" -name "*.php" -print0 | xargs -0 -n1 -P4 php -l
            fi
          done

      - name: Sicherheitsscan (Dependencies)
        # Prüft auf bekannte Schwachstellen in deinen Composer-Paketen
        run: composer audit

      - name: Unit-Tests (PHPUnit)
        run: vendor/bin/phpunit --no-progress

      - name: Build-Status
        run: echo "CI-Lauf erfolgreich abgeschlossen!"